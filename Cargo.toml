[workspace]
resolver = "3"
members = [
    "crates/*",
]
# Das Testprogramm für den Mikrocontroller braucht `unsafe` und ist deshalb ein eigener Workspace.
exclude = ["mcu"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
libm = "0.2"
neuronws-layers = { path = "crates/neuronws-layers" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
