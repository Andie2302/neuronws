[package]
name = "neuronws-layers"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[features]
default = []
# Mathe-Funktionen wie `exp`, `tanh`, `ln` und `sqrt` gibt es in `core` nicht.
# Sie sind nur mit `std` (aus der Standardbibliothek) oder `libm` verfügbar.
# Sind beide Features an, gewinnt `libm`: Dann rechnet jede Plattform mit demselben Code
# und bekommt dieselben Ergebnisse.
std = []
libm = ["dep:libm"]

[dependencies]
libm = { workspace = true, optional = true }

[[example]]
name = "learn_xor_sigmoid"
required-features = ["libm"]

[[example]]
name = "xor_seeds"
required-features = ["libm"]

[[example]]
name = "xor_loss_comparison"
required-features = ["libm"]

[[example]]
name = "learn_with_trainer"
required-features = ["libm"]

[[example]]
name = "build_your_own_layer"
required-features = ["libm"]
